name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      APP_ENV: local
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Static governance (no app import or credentials)
        run: python -B scripts/check_project.py
      - name: Install existing development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Offline tests
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Python lint
        run: python -B -m ruff check --no-cache app tests scripts
      - name: Python format
        run: python -B -m ruff format --check app tests scripts
      - name: Templates
        run: python -B -m djlint app/templates --lint
